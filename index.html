<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1322">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lanchonete Sociedade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap">
<style>
:root{
  /* Layout: sidebar escura fixa + área de trabalho clara; banner, 4 cartões de números, quadro em duas colunas. */
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f6f7fb; --fg:#0f172a; --muted:#5f6b85; --line:#e3e7ef;
  --accent:#ef2b2d; --accent-ink:#ffffff;
  --side:#0b1322; --side-fg:#e8edf7; --side-muted:#8c99b4; --side-line:#1b2740;
  --green:#0d9b4a; --blue:#1570ef; --amber:#d46f00; --violet:#7a4af0;
  --ok-bg:#d8f4e3; --ok-fg:#0a7236; --off-bg:#fde2e2; --off-fg:#b91c1f;
  --chip-bg:#e2eefe; --chip-fg:#1a5bbd;
  --scrim:rgba(8,13,26,.55);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1424; --surface:#151f33; --surface-2:#1a2640; --fg:#e8edf7; --muted:#97a4bf; --line:#25314c;
    --side:#070c18; --side-line:#16213a;
    --ok-bg:#12392a; --ok-fg:#63e09b; --off-bg:#3f1b21; --off-fg:#ff9294;
    --chip-bg:#1b3358; --chip-fg:#93bdff;
    --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#151f33; --surface-2:#1a2640; --fg:#e8edf7; --muted:#97a4bf; --line:#25314c;
  --side:#070c18; --side-line:#16213a;
  --ok-bg:#12392a; --ok-fg:#63e09b; --off-bg:#3f1b21; --off-fg:#ff9294;
  --chip-bg:#1b3358; --chip-fg:#93bdff;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.i{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 65%,#fff);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:14px;padding:22px 14px 18px;position:sticky;top:0;height:100dvh;align-self:start}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 8px}
.brand svg{width:46px;height:46px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.05;letter-spacing:-.01em}
.brand-sub{font-size:13px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-b{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:500;color:var(--side-fg);text-align:left}
.nav-b .i{color:var(--side-muted);width:1.45em;height:1.45em}
.nav-b:hover{background:var(--side-line)}
.nav-b.on{background:var(--accent);color:var(--accent-ink)}
.nav-b.on .i{color:var(--accent-ink)}
.side-gap{flex:1}
.clock{display:flex;gap:14px;align-items:center;border:1px solid var(--side-line);border-radius:12px;padding:16px}
.clock .i{width:30px;height:30px}
.clock b{font-size:15px}
.clock div div{font-size:12.5px;color:var(--side-muted)}
.clock .c-time{font-size:20px;color:var(--side-fg);font-family:var(--f-display);font-weight:700}
.side-note{display:flex;align-items:center;gap:12px;padding:6px;font-size:12px;color:var(--side-muted)}
.side-note .i{width:24px;height:24px;color:var(--side-fg)}
.side-note b{display:block;color:var(--side-fg);font-weight:500;font-size:13px}

.main{min-width:0;display:flex;flex-direction:column}
.hero{position:relative;overflow:hidden;min-height:156px;padding:26px 24px;background:linear-gradient(100deg,#180b06 0%,#3a190c 52%,#74300e 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:6px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,5vw,44px);letter-spacing:-.02em;line-height:1.05}
.hero p{max-width:34ch;font-size:16px;color:#f6e7dc}
.hero-art{position:absolute;right:0;bottom:-12px;height:190px;display:flex;align-items:flex-end;pointer-events:none}
.hero-art svg{height:100%;width:auto}
.hero-art svg:first-child{height:82%;margin-right:-34px;transform:rotate(-8deg)}
.hero-tools{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:2}
.chip-dark{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:rgba(10,14,24,.78);color:#fff;font-weight:500}
.chip-dark:hover{background:rgba(10,14,24,.95)}
.content{padding:20px 24px 28px;display:flex;flex-direction:column;gap:20px;flex:1;min-width:0}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:center;background:var(--side);color:var(--side-muted);padding:12px 24px;font-size:12.5px}
.status .on{display:inline-flex;align-items:center;gap:8px;color:var(--side-fg)}
.status .on::before{content:"";width:9px;height:9px;border-radius:50%;background:#22c55e}
.status em{display:inline-flex;align-items:center;gap:8px}
.status em .i{color:#f6a52b}

.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pagehead h1{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.015em}
.pagehead p{color:var(--muted);margin-top:2px}

/* ---------- cartões de números ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{display:flex;align-items:center;gap:16px;border-radius:12px;padding:18px 20px;color:#fff;min-width:0;box-shadow:var(--shadow)}
.tile.green{background:var(--green)} .tile.blue{background:var(--blue)} .tile.amber{background:var(--amber)} .tile.red{background:var(--accent);color:var(--accent-ink)}
.tile>.i{width:44px;height:44px;opacity:.95}
.tile small{display:block;font-size:15px}
.tile .big{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.tile .delta{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:2px}
.tile .delta .i{width:1.05em;height:1.05em}

/* ---------- quadro ---------- */
.board{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.005em}
.card-h h2 small{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted)}
.card-h .grow{flex:1}
.ic-b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);flex:none}
.ic-b .i{width:17px;height:17px}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:500;font-size:13.5px}
.link .i{width:1em;height:1em}
.count{display:grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--green);color:#fff;font-size:13px;font-weight:700}

.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;font-size:13px;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.tbl td.itens{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td.nw{white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td .i{color:var(--muted);width:1.1em;height:1.1em}
.num{display:inline-grid;place-items:center;min-width:40px;height:34px;padding:0 8px;border-radius:8px;font-weight:700;font-size:13.5px;color:#fff;background:var(--green);font-variant-numeric:tabular-nums}
.num.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.on{background:var(--ok-bg);color:var(--ok-fg)}
.pill.off{background:var(--off-bg);color:var(--off-fg)}

.top-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.tp{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 8px 12px;background:var(--surface)}
.tp .art{width:100%;aspect-ratio:1.15;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.tp .art svg{width:70%;height:86%}
.tp b{font-weight:500;font-size:13.5px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--chip-bg);color:var(--chip-fg);font-size:12px;font-weight:500}

.bills{display:flex;flex-direction:column}
.bi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.bi:first-child{border-top:0}
.bi:hover{background:var(--surface-2)}
.bi .stool{grid-row:span 2;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface-2);color:var(--fg)}
.bi .t{font-weight:700}
.bi .t small{font-weight:400;color:var(--muted);margin-left:6px}
.bi .d{grid-column:2;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .v{grid-column:3;grid-row:1;display:flex;gap:10px;align-items:center;font-weight:500}
.bi .go{grid-column:3;grid-row:2;justify-self:end;color:var(--muted)}
.empty{color:var(--muted);padding:14px 4px;text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:42px;padding:0 16px;border-radius:9px;font-weight:700;font-size:14px;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.red{background:var(--accent);color:var(--accent-ink)} .btn.green{background:var(--green)} .btn.blue{background:var(--blue)} .btn.amber{background:var(--amber)} .btn.violet{background:var(--violet)}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%;margin-top:14px;min-height:46px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{padding:0 10px;justify-content:flex-start;font-weight:500}

.sum{display:flex;flex-direction:column}
.sum div{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13.5px}
.sum div:nth-child(odd){background:var(--surface-2)}
.sum .i{width:1.05em;height:1.05em}
.sum .l{flex:1;color:var(--muted)}
.sum b{font-weight:500}
.sum .tot b{font-weight:700}

/* ---------- formulários e componentes ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:500;font-size:13px;color:var(--muted)}
.inp{height:42px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.inp:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.err{color:var(--off-fg);font-size:13px;min-height:1.2em}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{left:21px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.thumb{width:44px;height:38px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.thumb svg{width:30px;height:30px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab.sm{padding:5px 12px;font-size:13px}
.cat-row td{background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:15px;padding:9px 12px}
.pick-g{max-height:260px;overflow-y:auto}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--fg)}
input[type=color].inp{width:56px;padding:3px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row p{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-l{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;margin-bottom:5px}
.bar-l span:last-child{color:var(--muted);white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--surface-2)}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.bar.b i{background:var(--blue)} .bar.g i{background:var(--green)}

/* ---------- janela ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto;display:flex;flex-direction:column}
.sheet-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 18px 12px}
.sheet-h h3{font-family:var(--f-display);font-size:22px;font-weight:800}
.sheet-h p{color:var(--muted);margin-top:2px}
.sheet-b{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.li-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li-art{width:38px;height:38px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.li-art svg{width:26px;height:26px}
.li-t{display:flex;flex-direction:column;min-width:0}
.li-t span{font-size:12.5px;color:var(--muted)}
.li-v{min-width:74px;text-align:right;font-weight:700}
.qx{font-weight:700}
.step{display:flex;align-items:center;gap:4px}
.step button{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.step .i{width:15px;height:15px}
.step output{min-width:22px;text-align:center;font-weight:700}
.pick-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pick-p{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.pick-p:hover{border-color:var(--accent);background:var(--surface-2)}
.pick-p svg{width:28px;height:28px;flex:none}
.pick-p span{display:flex;flex-direction:column;min-width:0;font-size:13px;font-weight:500;line-height:1.25}
.pick-p small{color:var(--muted);font-weight:400}
.totals{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.totals div{display:flex;justify-content:space-between;color:var(--muted)}
.totals .g{color:var(--fg);font-family:var(--f-display);font-size:24px;font-weight:800}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mesa{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.mesa small{font-weight:400;color:var(--muted)}
.mesa:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.mesa:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}

.loading{padding:40px 24px;color:var(--muted);font-size:16px}
.dayrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dayrow .inp{width:auto}
.flip{transform:scaleX(-1)}
.status .bad{color:#ff9294}

/* ---------- cupom (impressora térmica) ---------- */
.paper-wrap{display:flex;justify-content:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.cp{flex:none;background:#fff;color:#000;font-family:'Courier New',Courier,ui-monospace,monospace;font-size:12px;line-height:1.35;width:72mm;padding:4mm 3mm;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.cp.p58{width:48mm}
.cp-c{text-align:center}
.cp-t{font-weight:700;font-size:15px}
.cp-b{font-weight:700}
.cp-hr{border:0;border-top:1px dashed #000;margin:6px 0}
.cp-r{display:flex;justify-content:space-between;gap:8px}
.cp-r span:last-child{text-align:right}
.cp-it{margin:3px 0}
.cp-big{font-size:15px;font-weight:700;margin:2px 0}
.hint{color:var(--muted);font-size:13px}
#print-root{display:none}
@media print{
  html,body{background:#fff!important}
  #app,#modal,#toast{display:none!important}
  #print-root{display:block}
  #print-root .cp{box-shadow:none;width:100%;margin:0}
}

/* ---------- responsivo ---------- */
@media (max-width:1180px){
  .board{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px}
  .brand{padding:0}
  .brand svg{width:38px;height:38px}
  .brand-name{font-size:21px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:6px;padding-bottom:2px}
  .nav-b{padding:9px 14px;gap:8px;white-space:nowrap;font-size:14px}
  .nav-b .i{width:1.2em;height:1.2em}
  .side-gap,.clock,.side-note{display:none}
  .hero{padding:24px 16px}
  .content{padding:16px}
  .status{padding:12px 16px}
}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
  .tile>.i{width:30px;height:30px}
  .tile .big{font-size:25px}
  .tile small{font-size:13.5px}
  .tile .delta{font-size:11.5px}
  .hero-art{opacity:.4}
  .hero p{max-width:100%}
  .actions{grid-template-columns:1fr}
  .tbl td.hide-s,.tbl th.hide-s{display:none}
  .li{grid-template-columns:auto minmax(0,1fr) auto}
  .li-v{grid-column:2/-1;text-align:left}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.nav-b,.tab,.pick-p,.mesa,.sw::after{transition:background-color .15s,filter .15s,border-color .15s,left .15s}
}

/* ===== Caixa (PDV), turnos e documentos ===== */
.tile .big{font-size:clamp(22px,2.2vw,32px);white-space:nowrap}
.actions .btn{white-space:normal;line-height:1.2;text-align:center}
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;align-items:start}
.pdv-l,.pdv-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.pdv-r{position:sticky;top:12px}
.pdv .pick-g{max-height:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pdv .pick-p{min-height:54px;position:relative}
.pdv .pick-p .no{position:absolute;top:3px;right:6px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pdv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pdv-bar .inp{flex:1;min-width:180px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chipb{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;text-align:left}
.chipb small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chipb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chipb.new{border-style:dashed;justify-content:center}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:14px}
.banner.warn{border-color:#e8a317}
.banner b{font-weight:700}
.banner .tabs{gap:6px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.dark{background:#334155}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel .li-list{max-height:42vh;overflow:auto}
.li-t em{display:block;font-style:normal;font-size:12px;color:var(--accent)}
.li-t .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:#e8a317;color:#222;margin-left:6px}
.li{grid-template-columns:auto minmax(0,1fr) auto auto auto}
.li .ib.s{width:30px;height:30px}
.tot-big{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:800;font-size:26px}
.pad2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mesa.free{border-style:dashed;color:var(--muted)}
.mesa.occ{border-color:var(--accent);background:var(--surface-2)}
.mesa.occ b{font-size:13px}
.board2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.board2 .mesa{align-items:flex-start;padding:12px;min-height:84px;text-align:left}
.board2 .mesa .t{font-size:12px;font-weight:500;color:var(--muted)}
.paylines{display:flex;flex-direction:column;gap:6px}
.payline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.big-in{height:52px;font-size:22px;font-weight:700;text-align:right}
.rest{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.rest.ok{color:var(--ok-fg,#0d9b4a)}
.rest.bad{color:var(--off-fg,#c0262b)}
.shiftchip{margin:0 4px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12.5px;line-height:1.35;display:flex;gap:8px;align-items:center}
.shiftchip i{width:9px;height:9px;border-radius:50%;background:#e8a317;flex:none}
.shiftchip.on i{background:#22c55e}
.cp-l{white-space:pre-wrap;word-break:break-word}
.cp-k{font-size:15px;font-weight:700;margin-top:3px}
.cp-n{padding-left:12px;font-weight:700}
.cp-r.cp-b{font-weight:700}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--muted);font-family:inherit}
@media (max-width:1100px){.pdv{grid-template-columns:1fr}.pdv-r{position:static}.panel .li-list{max-height:none}}
@media (max-width:560px){.li{grid-template-columns:auto minmax(0,1fr) auto}.li .li-v{grid-column:2/-1}.pdv .pick-g{grid-template-columns:repeat(2,1fr)}}

/* ===== Visual PDV (preto + amarelo) ===== */
:root[data-theme="dark"]{--bg:#0a0a0c;--surface:#151518;--surface-2:#1e1e22;--fg:#f4f4f5;--muted:#9a9aa3;--line:#2a2a30;--side:#111114;--side-line:#232328;--chip-bg:#2a2a30;--chip-fg:#e8e8ea;--shadow:0 1px 2px rgba(0,0,0,.5)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar .grow{flex:1}
.search{position:relative;flex:1;max-width:520px;min-width:200px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:1.1em;height:1.1em}
.search .inp{padding-left:38px;border-radius:99px;background:var(--surface)}
.topbar .btn.ghost{min-height:40px}
.pdv{align-items:start}
.pdv .pick-g{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.pdv .pick-p{flex-direction:column;align-items:stretch;gap:8px;padding:10px;border-radius:12px;min-height:0;text-align:left}
.pdv .pick-p svg{width:100%;height:82px;padding:6px;background:var(--surface-2);border-radius:8px}
.pdv .pick-p>span:not(.no){font-weight:600;font-size:13.5px}
.pdv .pick-p small{color:var(--accent);font-weight:700;font-size:14px}
.pdv .pick-p .no{top:14px;right:16px;background:var(--surface);border-radius:6px;padding:0 5px}
.pdv-r{position:sticky;top:12px}
.pdv-r .panel{height:calc(100dvh - 100px);min-height:520px}
.panel-h{display:flex;align-items:center;justify-content:space-between}
.panel-h h2{font-family:var(--f-display);font-size:20px}
.pdv-r .panel .li-list{flex:1;max-height:none;overflow:auto;min-height:90px}
.btn.red.finish{min-height:54px;font-size:16px}
.pay-ink{color:var(--accent)}
.splash{min-height:100dvh;display:grid;place-items:center;background:#0a0a0c;color:#f4f4f5}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px;width:100%;max-width:380px}
.splash-in svg.logo{width:84px;height:84px}
.splash-in h1{font-family:var(--f-display);font-size:30px}
.splash-in p{color:#9a9aa3}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #2a2a30;border-top-color:#ffc21a;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lock-card{width:100%;background:#151518;border:1px solid #2a2a30;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left}
.lock-card .inp{background:#0a0a0c;color:#f4f4f5;border-color:#2a2a30}
.lock-card label{color:#9a9aa3;font-size:13px}
.lock-card .link{text-align:center}
.code{font-family:'Courier New',monospace;font-size:26px;font-weight:700;letter-spacing:.12em;text-align:center;color:#ffc21a;padding:12px;border:1px dashed #ffc21a;border-radius:10px}
@media (max-width:1100px){.pdv-r .panel{height:auto}}
.pad2 .finish:only-child{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* Banco de dados local do navegador (IndexedDB): tabelas products, bills e meta. */
var S=null;
var DB={db:null,seen:{},err:''};
function dbOpen(){
  return new Promise(function(res,rej){
    try{
      if(!window.indexedDB){rej(new Error('sem IndexedDB'));return}
      var r=window.indexedDB.open('lanchonete-sociedade',1);
      r.onupgradeneeded=function(){
        var d=r.result;
        d.createObjectStore('products',{keyPath:'id'});
        d.createObjectStore('bills',{keyPath:'id'});
        d.createObjectStore('meta',{keyPath:'k'});
      };
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error||new Error('erro ao abrir'))};
      r.onblocked=function(){rej(new Error('banco bloqueado por outra janela'))};
    }catch(e){rej(e)}
  });
}
function dbLoad(db){
  return new Promise(function(res,rej){
    var out={products:[],bills:[],meta:{}};
    var t=db.transaction(['products','bills','meta'],'readonly');
    t.objectStore('products').getAll().onsuccess=function(e){out.products=e.target.result};
    t.objectStore('bills').getAll().onsuccess=function(e){out.bills=e.target.result};
    t.objectStore('meta').getAll().onsuccess=function(e){e.target.result.forEach(function(m){out.meta[m.k]=m.v})};
    t.oncomplete=function(){res(out)};
    t.onerror=function(){rej(t.error)};
    t.onabort=function(){rej(t.error)};
  });
}
function writeAll(){
  if(!DB.db||!S)return;
  try{
    var stores=['products','bills','meta'],t;
    try{t=DB.db.transaction(stores,'readwrite',{durability:'strict'})}catch(e){t=DB.db.transaction(stores,'readwrite')}
    var ps=t.objectStore('products'),bs=t.objectStore('bills'),ms=t.objectStore('meta');
    ps.clear();
    S.products.forEach(function(p){ps.put(p)});
    var cur={};
    S.bills.forEach(function(b){var j=JSON.stringify(b);cur[b.id]=j;if(DB.seen[b.id]!==j)bs.put(b)});
    Object.keys(DB.seen).forEach(function(id){if(!(id in cur))bs.delete(+id)});
    DB.seen=cur;
    ms.put({k:'settings',v:S.settings});
    ms.put({k:'nextId',v:S.nextId});
    ms.put({k:'shifts',v:S.shifts||[]});
    t.onerror=t.onabort=function(){DB.err='Não foi possível gravar no banco local.';render()};
  }catch(e){DB.err='Não foi possível gravar no banco local.'}
}
var savePending=false;
function save(){
  if(savePending)return;
  savePending=true;
  Promise.resolve().then(function(){savePending=false;writeAll()});
}
function fixSettings(st){if(st.accent==='#ef2b2d')st.accent='#ffc21a';return st}
function assemble(d){
  var maxId=d.bills.reduce(function(m,b){return Math.max(m,b.id)},0);
  return{
    products:d.products.sort(function(a,b){return a.id-b.id}),
    bills:d.bills.sort(function(a,b){return a.id-b.id}),
    shifts:d.meta.shifts||[],
    nextId:Math.max(+d.meta.nextId||1,maxId+1),
    settings:fixSettings(Object.assign(defaults(),d.meta.settings))
  };
}
function boot(){
  var t0=Date.now();
  dbOpen().then(function(db){DB.db=db;return dbLoad(db)}).then(function(d){
    if(d.meta.settings){
      S=assemble(d);
      S.bills.forEach(function(b){DB.seen[b.id]=JSON.stringify(b)});
    }else{
      S=seed();
      save();
    }
  }).catch(function(){
    DB.db=null;
    DB.err='Banco local indisponível neste navegador. Os dados valem só enquanto esta janela estiver aberta.';
    S=seed();
  }).then(function(){
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    var gone=purgeOld();
    applyAccent();
    authed=!S.settings.loginOn;
    authMode=S.settings.pwHash?'login':'setup';
    setTimeout(function(){render();if(gone&&authed)toast(purgeMsg(gone),6000);dailyBackup()},Math.max(0,700-(Date.now()-t0)));
  });
}

/* ================= cálculos ================= */
var P=function(id){return S.products.filter(function(p){return p.id===+id})[0]};
var bill=function(id){return S.bills.filter(function(b){return b.id===+id})[0]};
var r2=function(n){return Math.round(n*100)/100};
/* Preço "congelado": o valor do produto no momento em que foi lançado na comanda. */
var unit=function(b,k){var s=b.prices&&b.prices[k];if(s!=null)return s;var p=P(k);return p?p.price:0};
var sub=function(b){return r2(Object.keys(b.items).reduce(function(s,k){return s+unit(b,k)*b.items[k]},0))};
var discV=function(b){var s=sub(b),d=b.disc;if(!d||!(d.v>0))return 0;return r2(Math.min(s,d.t==='p'?s*Math.min(100,d.v)/100:d.v))};
var feeV=function(b){return b.fee?r2((sub(b)-discV(b))*0.1):0};
var tot=function(b){return r2(sub(b)-discV(b)+feeV(b))};
var payList=function(b){return b.pays&&b.pays.length?b.pays:(b.open?[]:[{m:b.pay||'Pix',v:tot(b)}])};
var qtyOf=function(b){return Object.keys(b.items).reduce(function(a,k){return a+b.items[k]},0)};
var dname=function(b){return b.name?b.name+' · '+b.label:b.label};
var who=function(b){return esc(b.name||b.label)+'<small class="tn">'+(b.name?esc(b.label)+' · ':'')+(b.day&&b.day!==dayKey()?dayLabel(b.day).slice(0,5)+' ':'')+b.time+'</small>'};
var summary=function(b){var t=Object.keys(b.items).map(function(k){var p=P(k);return p?b.items[k]+'x '+p.name:''}).filter(Boolean).join(' + ');return t||'Sem itens'};
var bday=function(b){return b.day||dayKey()};
var dayBills=function(k){return S.bills.filter(function(b){return bday(b)===k})};
var parseMoney=function(s){
  s=String(s==null?'':s).replace(/[^\d.,-]/g,'');
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  var n=parseFloat(s);return isFinite(n)?r2(n):NaN;
};
var fmtIn=function(n){return n>0?r2(n).toFixed(2).replace('.',','):''};
/* Turno de caixa */
var curShift=function(){return (S.shifts||[]).filter(function(s){return !s.closedAt})[0]};
var shiftById=function(id){return (S.shifts||[]).filter(function(s){return s.id===+id})[0]};
function shiftCalc(s){
  var bs=S.bills.filter(function(b){return !b.open&&b.shift===s.id}),byPay={},total=0,disc=0;
  bs.forEach(function(b){total+=tot(b);disc+=discV(b);payList(b).forEach(function(p){byPay[p.m]=r2((byPay[p.m]||0)+p.v)})});
  var sup=0,san=0;(s.moves||[]).forEach(function(m){if(m.t==='sup')sup+=m.v;else san+=m.v});
  var cash=byPay['Dinheiro']||0;
  return{bills:bs,n:bs.length,total:r2(total),disc:r2(disc),byPay:byPay,cash:cash,sup:r2(sup),san:r2(san),expected:r2(s.fund+cash+sup-san)};
}
/* Limpeza automática: apaga contas FECHADAS com mais de N dias (padrão 60). Contas abertas nunca são apagadas. */
var oldBills=function(){var n=Math.max(1,+S.settings.keepDays||60),cut=addDays(dayKey(),-n);return S.bills.filter(function(b){return !b.open&&bday(b)<cut})};
function purgeOld(){
  if(!S||!S.settings.keepOn)return 0;
  var n=Math.max(1,+S.settings.keepDays||60),cut=addDays(dayKey(),-n);
  var sl=S.shifts.length;
  S.shifts=S.shifts.filter(function(s){return !s.closedAt||dayKey(new Date(s.closedAt))>=cut});
  var old=oldBills();
  if(!old.length){if(S.shifts.length!==sl)save();return 0}
  var ids={};old.forEach(function(b){ids[b.id]=1});
  S.bills=S.bills.filter(function(b){return !ids[b.id]});
  save();
  return old.length;
}
var purgeMsg=function(n){return n+(n===1?' conta antiga apagada':' contas antigas apagadas')+' (mais de '+(+S.settings.keepDays||60)+' dias).'};
var listP=function(){return S.products.slice().sort(function(a,b){return CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||a.id-b.id})};
function stats(k){
  var L=dayBills(k),n=L.length,total=0,all=0,items=0,open=0;
  L.forEach(function(b){all+=tot(b);items+=qtyOf(b);if(b.open)open++;else total+=tot(b)});
  var closed=n-open;
  return{n:n,total:total,all:all,items:items,open:open,closed:closed,ticket:closed?total/closed:0};
}
function top(k){
  var c={};
  dayBills(k).forEach(function(b){Object.keys(b.items).forEach(function(id){c[id]=(c[id]||0)+b.items[id]})});
  return Object.keys(c).map(function(id){return{p:P(id),q:c[id]}}).filter(function(x){return x.p}).sort(function(a,b){return b.q-a.q||a.p.name.localeCompare(b.p.name)}).slice(0,6);
}
function agg(k){
  var byP={},byC={},byPay={},recv=0,todo=0,disc=0;
  dayBills(k).forEach(function(b){
    var s=sub(b),f=s?tot(b)/s:1;
    Object.keys(b.items).forEach(function(id){
      var p=P(id);if(!p)return;var q=b.items[id],v=unit(b,id)*q*f;
      byP[p.id]=byP[p.id]||{p:p,q:0,v:0};byP[p.id].q+=q;byP[p.id].v+=v;
      byC[p.cat]=byC[p.cat]||{q:0,v:0};byC[p.cat].q+=q;byC[p.cat].v+=v;
    });
    if(b.open){todo+=tot(b)}else{recv+=tot(b);disc+=discV(b);payList(b).forEach(function(p){byPay[p.m]=(byPay[p.m]||0)+p.v})}
  });
  return{byP:byP,byC:byC,byPay:byPay,recv:recv,todo:todo,disc:disc};
}

  var opts=['Balcão'];for(var j=1;j<=S.settings.tables;j++)opts.push('Mesa '+String(j).padStart(2,'0'));

    var p=P(k);if(!p)return '';var q=b.items[k],nt=(b.notes||{})[k],isNew=q>((b.sent||{})[k]||0);

      +'<button class="ib s" data-a="obs-m" data-b="'+b.id+'" data-p="'+k+'" aria-label="Observação de '+esc(p.name)+'">'+I('edit')+'</button>'
      +'<div class="step"><button data-a="qty" data-b="'+b.id+'" data-p="'+k+'" data-d="-1" aria-label="Diminuir '+esc(p.name)+'">'+I('minus')+'</button><output class="tn">'+q+'</output><button data-a="qty" data-b="'+b.id+'" data-p="'+k+'" data-d="1" aria-label="Aumentar '+esc(p.name)+'">'+I('plus')+'</button></div>'
      +'<span class="li-v tn">'+brl(unit(b,k)*q)+'</span></li>';

    +'<div class="field"><label for="b-label">Mesa ou balcão</label><select class="inp" id="b-label">'+opts.map(function(o){return '<option'+(o===b.label?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></div></div>'
    +'<ul class="li-list">'+items+'</ul>'+totals
    +'<div class="tabs"><button class="btn sm ghost" data-a="disc-m" data-b="'+b.id+'">Desconto</button><button class="btn sm ghost'+(b.fee?' on':'')+'" data-a="fee" data-b="'+b.id+'" aria-pressed="'+!!b.fee+'">Serviço 10%'+(b.fee?' ✓':'')+'</button><button class="btn sm ghost" data-a="move-m" data-b="'+b.id+'">Mudar de mesa / juntar</button></div>'
    +'<div class="pad2">'+(S.settings.useKitchen?'<button class="btn dark" data-a="kitchen" data-b="'+b.id+'"'+(ids.length?'':' disabled')+'>'+I('print')+'Cozinha'+(news?' ('+news+')':'')+' <span class="kbd">F9</span></button>':'')+'<button class="btn red finish" data-a="pay-open" data-b="'+b.id+'"'+(ids.length?'':' disabled')+'>'+I('check')+'Finalizar pedido <span class="kbd">F5</span></button></div>'

function bars(map,max,cls,fmt){

function sha(s){
  try{if(window.crypto&&crypto.subtle&&window.TextEncoder){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}}catch(e){}
  var h=5381,i;for(i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return Promise.resolve('x'+(h>>>0).toString(16));
}
function rnd(n,al){var a=new Uint8Array(n),i;try{crypto.getRandomValues(a)}catch(e){for(i=0;i<n;i++)a[i]=Math.floor(Math.random()*256)}return Array.prototype.map.call(a,function(x){return al[x%al.length]}).join('')}
var normCode=function(c){c=String(c).toUpperCase().replace(/[^A-Z0-9]/g,'');return c.slice(0,4)+'-'+c.slice(4)};
/* Uma única senha: a mesma do login também libera a aba Produtos. */
var PWK=function(){return ['pwSalt','pwHash','recHash']};
function setPassword(pw,who){
  var k=PWK(who),al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',salt=rnd(16,'0123456789abcdef'),code=rnd(4,al)+'-'+rnd(4,al);
  return Promise.all([sha(salt+pw),sha(salt+code)]).then(function(h){S.settings[k[0]]=salt;S.settings[k[1]]=h[0];S.settings[k[2]]=h[1];return code});
}
function checkPw(pw,who){var k=PWK(who);return sha((S.settings[k[0]]||'')+pw).then(function(h){return h===S.settings[k[1]]})}

/* ================= documentos (cupom, cozinha, fechamento de caixa) ================= */
var PAYS=['Dinheiro','Pix','Débito','Crédito'];
var n2=function(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
var fdt=function(d){return d.toLocaleDateString('pt-BR')+' '+hhmm(d)};
/* Cada documento é uma lista de linhas; a mesma lista gera a prévia na tela e o texto para copiar. */
function docModel(kind,id){
  var L=[],hr=['hr'],nm=S.settings.name.toUpperCase();
  if(kind==='cupom'){
    var b=bill(id);if(!b)return null;
    L.push(['c',nm,'cp-t'],['c','CUPOM DE CONTROLE INTERNO'],['c','*** NÃO É DOCUMENTO FISCAL ***','cp-b'],hr,
      ['r','Comanda',pad(b.id)]);
    if(b.name)L.push(['r','Nome',b.name]);
    L.push(['r','Local',b.label],['r','Abertura',(b.day?dayLabel(b.day)+' ':'')+b.time],['r','Fechamento',b.closedAt?fdt(new Date(b.closedAt)):'—'],hr,['r','ITEM','VALOR (R$)','cp-b']);
    Object.keys(b.items).forEach(function(k){var p=P(k);if(!p)return;var q=b.items[k];L.push(['l',p.name]);L.push(['r','  '+q+' x '+n2(unit(b,k)),n2(unit(b,k)*q)]);if(b.notes&&b.notes[k])L.push(['l','  Obs: '+b.notes[k]])});
    L.push(hr,['r','Qtd. de itens',String(qtyOf(b))],['r','Subtotal',n2(sub(b))]);
    if(discV(b))L.push(['r','Desconto','- '+n2(discV(b))]);
    if(b.fee)L.push(['r','Serviço 10%',n2(feeV(b))]);
    L.push(['r','TOTAL',brl(tot(b)),'cp-big'],hr);
    if(b.open)L.push(['r','Pagamento','—']);
    else{payList(b).forEach(function(p){L.push(['r',p.m,n2(p.v)])});if(b.change>0)L.push(['r','Dinheiro recebido',n2(b.cashIn)],['r','Troco',n2(b.change)])}
    L.push(hr,['c','Impresso em '+fdt(new Date())],['c','Obrigado pela preferência!'],['c','Sem valor fiscal']);
    return{title:'Cupom da comanda '+pad(b.id),L:L};
  }
  if(kind==='cozinha'){
    var c=bill(id);if(!c)return null;
    L.push(['c','COZINHA','cp-t'],['c','Pedido às '+hhmm()],hr,['r','Comanda',c.name||'—'],['r','Local',c.label],['r','Conta',pad(c.id)],hr);
    var seen={},ks=Object.keys(c.items).concat(Object.keys(c.sent||{})).filter(function(k){if(seen[k])return false;seen[k]=1;return true});
    var cnt=0;
    ks.forEach(function(k){
      var p=P(k);if(!p)return;var q=c.items[k]||0,s=(c.sent||{})[k]||0;
      if(q>s){cnt++;L.push(['l',(q-s)+' x '+p.name,'cp-k']);if(c.notes&&c.notes[k])L.push(['l','Obs: '+c.notes[k],'cp-n'])}
      else if(q<s){cnt++;L.push(['l','CANCELAR '+(s-q)+' x '+p.name,'cp-k'])}
    });
    if(!cnt)L.push(['c','Nada novo para enviar.']);
    L.push(hr);
    return{title:'Pedido para a cozinha',L:L,cnt:cnt};
  }
  if(kind==='caixa'){
    var s=shiftById(id);if(!s)return null;var x=shiftCalc(s);
    L.push(['c',nm,'cp-t'],['c','FECHAMENTO DE CAIXA'],['c','Controle interno, sem valor fiscal'],hr,
      ['r','Abertura',fdt(new Date(s.openedAt))],['r','Fechamento',s.closedAt?fdt(new Date(s.closedAt)):'em aberto'],['r','Comandas pagas',String(x.n)],hr,
      ['r','VENDAS POR FORMA','R$','cp-b']);
    var ms=Object.keys(x.byPay);if(!ms.length)L.push(['l','Nenhuma venda']);
    ms.forEach(function(m){L.push(['r',m,n2(x.byPay[m])])});
    L.push(['r','TOTAL VENDIDO',brl(x.total),'cp-big']);
    if(x.disc)L.push(['r','Descontos dados',n2(x.disc)]);
    L.push(hr,['r','DINHEIRO NA GAVETA','R$','cp-b'],['r','Fundo de troco',n2(s.fund)],['r','+ Vendas em dinheiro',n2(x.cash)],['r','+ Suprimentos',n2(x.sup)],['r','- Sangrias',n2(x.san)],['r','Esperado',n2(x.expected),'cp-b']);
    if(s.closedAt){L.push(['r','Contado',n2(s.counted),'cp-b']);var df=r2(s.counted-x.expected);L.push(['r',df===0?'Diferença':df>0?'Sobra':'Falta',n2(Math.abs(df)),'cp-big'])}
    if((s.moves||[]).length){L.push(hr,['l','MOVIMENTOS','cp-b']);s.moves.forEach(function(mv){L.push(['r',hhmm(new Date(mv.at))+' '+(mv.t==='sup'?'Suprimento':'Sangria'),n2(mv.v)]);if(mv.note)L.push(['l','  '+mv.note])})}
    L.push(hr,['c','Impresso em '+fdt(new Date())]);
    return{title:'Fechamento de caixa',L:L};
  }
  return null;
}
function docHTML(m){
  return m.L.map(function(r){
    if(r[0]==='hr')return '<hr class="cp-hr">';
    if(r[0]==='c')return '<div class="cp-c '+(r[2]||'')+'">'+esc(r[1])+'</div>';
    if(r[0]==='l')return '<div class="cp-l '+(r[2]||'')+'">'+esc(r[1])+'</div>';
    return '<div class="cp-r '+(r[3]||'')+'"><span>'+esc(r[1])+'</span><span>'+esc(r[2])+'</span></div>';
  }).join('');
}
function docText(m){
  var w=paperW()===58?32:42,sp=function(n){return new Array(Math.max(0,n)+1).join(' ')};
  var A=function(t){return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'')};
  var out=[],hr=new Array(w+1).join('-');
  m.L.forEach(function(r){
    if(r[0]==='hr'){out.push(hr);return}
    var a=A(r[1]);
    if(r[0]==='c'){out.push(sp(Math.floor((w-a.length)/2))+a);return}
    if(r[0]==='l'){while(a.length>w){out.push(a.slice(0,w));a=a.slice(w)}out.push(a);return}
    var b=A(r[2]);if(a.length+b.length+1>w)a=a.slice(0,Math.max(1,w-b.length-1));
    out.push(a+sp(w-a.length-b.length)+b);
  });
  return out.join('\n');
}

function renderModal(){

  el.innerHTML=modalHTML();
  el.hidden=false;
  el.scrollTop=scroll;

var tt;
function toast(msg,ms){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},ms||2400)}
function commit(){save();render();renderModal()}
function applyAccent(){
  var c=S.settings.accent,r=document.documentElement,h=/^#[0-9a-f]{6}$/i.test(c)?c:'#ffc21a';
  var l=(0.299*parseInt(h.slice(1,3),16)+0.587*parseInt(h.slice(3,5),16)+0.114*parseInt(h.slice(5,7),16))/255;
  r.style.setProperty('--accent',h);r.style.setProperty('--accent-ink',l>0.6?'#111111':'#ffffff');
  r.setAttribute('data-theme',S.settings.theme==='light'?'light':'dark');
}

/* ================= ações ================= */
var lostImport=false;
function resetPw(){var st=S.settings;st.pwHash='';st.pwSalt='';st.recHash='';st.loginOn=true;ownerOk=false;authed=false}
function importData(o){
  if(!o||!Array.isArray(o.products)||!Array.isArray(o.bills)||!o.settings)throw new Error('formato');
  var maxId=o.bills.reduce(function(m,b){return Math.max(m,+b.id||0)},0);
  S={products:o.products,bills:o.bills,shifts:Array.isArray(o.shifts)?o.shifts:[],nextId:Math.max(+o.nextId||1,maxId+1),settings:Object.assign(defaults(),o.settings)};
  cur=0;modal=null;
  if(lostImport){lostImport=false;resetPw();authMode='setup'}
  save();applyAccent();render();renderModal();toast(authed?'Backup restaurado':'Backup restaurado. Crie uma nova senha.',5000);
}
/* Backup diário automático: no máximo um por dia, depois que a pessoa entrou no sistema. */
function dailyBackup(){
  if(!S||!authed||sandboxed||!S.settings.autoBackup)return;
  if(!S.bills.length&&!S.shifts.length)return;
  var lb=S.settings.lastBackup;
  if(lb&&dayKey(new Date(lb))===dayKey())return;
  if(exportBackup(true))toast('Backup diário salvo na pasta Downloads.',5000);
}
function exportBackup(auto){
  if(sandboxed){if(!auto)toast('O download é bloqueado na demonstração online. No sistema instalado ele funciona.',5200);return false}
  var data=JSON.stringify({app:'lanchonete-sociedade',version:2,exportedAt:new Date().toISOString(),products:S.products,bills:S.bills,shifts:S.shifts,nextId:S.nextId,settings:S.settings},null,1);
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='backup-lanchonete-sociedade-'+dayKey()+(auto?'-'+hhmm().replace(':','h'):'')+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
  S.settings.lastBackup=new Date().toISOString();save();
  return true;
}
function addItem(b,pid,n){
  var p=P(pid);if(!p)return;
  b.prices=b.prices||{};if(b.prices[pid]==null)b.prices[pid]=p.price;
  b.items[pid]=(b.items[pid]||0)+n;
}
function printDoc(){
  var d=docModel(modal.kind,modal.id);if(!d)return;
  if(modal.kind==='cozinha'){var b=bill(modal.id);if(b)b.sent=Object.assign({},b.items);save()}
  if(sandboxed){toast('A impressão direta é bloqueada nesta demonstração online. Use “Copiar texto”.',5200);return}
  $('#print-root').innerHTML='<div class="cp'+(paperW()===58?' p58':'')+'">'+docHTML(d)+'</div>';
  $('#page-style').textContent='@page{size:'+paperW()+'mm auto;margin:0}';
  window.print();
  if(modal.kind==='cozinha'){render();renderModal()}
}

  reopen:function(d){
    var b=bill(d.b);if(!b)return;
    var sh=b.shift?shiftById(b.shift):null;
    if(sh&&sh.closedAt){toast('Esse recebimento pertence a um caixa já fechado. Não dá para reabrir.',5000);return}
    b.open=true;['pay','pays','cashIn','change','shift','closedAt'].forEach(function(k){delete b[k]});
    cur=b.id;view='caixa';modal=null;commit();toast('Comanda reaberta');
  },
  'del-ask':function(d){var b=bill(d.b);modal={type:'ask',title:'Excluir '+dname(b)+'?',text:'Os itens lançados serão perdidos. Não dá para desfazer.',yes:'Excluir',act:'del-bill',data:{b:b.id}};renderModal()},
  'del-bill':function(d){S.bills=S.bills.filter(function(b){return b.id!==+d.b});if(cur===+d.b)cur=0;modal=null;save();render();renderModal();toast('Comanda excluída')},
  'ask-yes':function(){var mm=modal;modal=null;A[mm.act](mm.data||{})},
  'move-m':function(d){modal={type:'move',id:+d.b};renderModal()},
  transfer:function(d){var b=bill(d.b);b.label=d.label;modal=null;commit();toast('Comanda movida para '+d.label)},
  merge:function(d){
    var b=bill(d.b),t=bill(d.to);if(!b||!t)return;
    Object.keys(b.items).forEach(function(k){
      t.prices=t.prices||{};if(t.prices[k]==null)t.prices[k]=unit(b,k);
      t.items[k]=(t.items[k]||0)+b.items[k];
      if(b.notes&&b.notes[k]){t.notes=t.notes||{};t.notes[k]=t.notes[k]?t.notes[k]+'; '+b.notes[k]:b.notes[k]}
    });
    Object.keys(b.sent||{}).forEach(function(k){t.sent=t.sent||{};t.sent[k]=(t.sent[k]||0)+b.sent[k]});
    if(!t.name&&b.name)t.name=b.name;
    S.bills=S.bills.filter(function(x){return x.id!==b.id});cur=t.id;modal=null;commit();toast('Itens juntados em '+dname(t));
  },
  'shift-open-m':function(){modal={type:'shift-open'};renderModal()},
  'shift-open':function(){
    var raw=$('#s-fund').value.trim(),v=raw?parseMoney(raw):0;
    if(!(v>=0)){$('#s-err').textContent='Informe um valor válido, por exemplo 100,00.';return}
    var then=modal.then;
    S.shifts.push({id:Date.now(),openedAt:new Date().toISOString(),fund:v,moves:[]});
    modal=null;save();render();renderModal();toast('Caixa aberto');
    if(then)A['pay-open']({b:then});
  },
  'move-cash-m':function(d){modal={type:'cash',t:d.t};renderModal()},
  'cash-ok':function(){
    var v=parseMoney($('#c-val').value),sh=curShift();
    if(!sh){modal=null;renderModal();return}
    if(!(v>0)){$('#c-err').textContent='Informe um valor maior que zero.';return}
    sh.moves.push({t:modal.t,v:v,note:$('#c-note').value.trim(),at:new Date().toISOString()});
    var sup=modal.t==='sup';modal=null;commit();toast((sup?'Suprimento':'Sangria')+' de '+brl(v)+' registrado');
  },
  'shift-close-m':function(){if(!curShift())return;modal={type:'shift-close'};renderModal()},
  'shift-close':function(){
    var sh=curShift();if(!sh)return;
    var raw=$('#sc-val').value.trim(),v=parseMoney(raw);
    if(!raw||!(v>=0)){$('#sc-err').textContent='Conte o dinheiro da gaveta e informe o valor (pode ser 0).';return}
    var c=shiftCalc(sh);
    sh.closedAt=new Date().toISOString();sh.counted=v;sh.expected=c.expected;sh.diff=r2(v-c.expected);
    modal={type:'doc',kind:'caixa',id:sh.id,back:null};
    save();render();renderModal();
    var ok=exportBackup(true);
    toast(ok?'Caixa fechado. Backup salvo na pasta Downloads.':'Caixa fechado.',5000);
  },
  opt:function(d){S.settings[d.k]=!S.settings[d.k];save();render();toast(S.settings[d.k]?'Ativado':'Desativado')},
  'login-toggle':function(){
    if(S.settings.loginOn){if(!S.settings.pwHash){S.settings.loginOn=false;save();render();return}modal={type:'pw',mode:'off'};renderModal();return}
    if(S.settings.pwHash){S.settings.loginOn=true;save();render();toast('Login ativado');return}
    modal={type:'pw',mode:'set'};renderModal();
  },
  'pw-m':function(){modal={type:'pw',mode:'change'};renderModal()},
  'pw-ok':function(){
    var m=modal,cur=$('#pw-cur')?$('#pw-cur').value:'',n1=$('#pw-new')?$('#pw-new').value:'',n2_=$('#pw-new2')?$('#pw-new2').value:'';
    var er=function(t){$('#pw-err').textContent=t};
    if(m.mode!=='off'){if(n1.length<4){er('A nova senha precisa ter pelo menos 4 caracteres.');return}if(n1!==n2_){er('As senhas não são iguais.');return}}
    var ow=m.who==='owner',flag=ow?'ownOn':'loginOn';
    var go=function(){
      if(m.mode==='off'){S.settings[flag]=false;modal=null;save();render();renderModal();toast(ow?'Senha de Produtos desativada':'Login desativado');return}
      setPassword(n1,m.who).then(function(code){S.settings[flag]=true;save();modal={type:'pw',code:code};render();renderModal()});
    };
    if(m.mode==='set')go();else checkPw(cur,m.who).then(function(ok){if(ok)go();else er('Senha atual incorreta.')});
  },
  lock:function(){ownerOk=false;authed=false;authMode='login';modal=null;renderModal();render()},
  login:function(){var pw=$('#lg-pw').value;checkPw(pw).then(function(ok){if(ok){authed=true;render();dailyBackup()}else{authErr('Senha incorreta.');$('#lg-pw').select()}})},
  'setup-pw':function(){
    var a=$('#lg-pw').value,b=$('#lg-pw2').value;
    if(a.length<4){authErr('A senha precisa ter pelo menos 4 caracteres.');return}
    if(a!==b){authErr('As senhas não são iguais.');return}
    setPassword(a).then(function(code){S.settings.loginOn=true;save();recShow=code;render()});
  },
  forgot:function(){authMode='recover';render()},
  lost:function(){authMode='lost';render()},
  'lost-import':function(){lostImport=true;var f=$('#bk-file');if(f)f.click()},
  'lost-wipe':function(){
    if(String($('#lost-conf').value).trim().toUpperCase()!=='APAGAR'){authErr('Digite APAGAR para confirmar.');return}
    S.bills=[];S.shifts=[];S.nextId=1;resetPw();authMode='setup';save();render();
  },
  'back-login':function(){authMode='login';render()},
  recover:function(){
    var code=normCode($('#lg-code').value),pw=$('#lg-pw').value;
    if(pw.length<4){authErr('A nova senha precisa ter pelo menos 4 caracteres.');return}
    sha(S.settings.pwSalt+code).then(function(h){
      if(h!==S.settings.recHash){authErr('Código de recuperação incorreto.');return}
      setPassword(pw).then(function(nc){save();recShow=nc;render()});
    });
  },
  'auth-done':function(){recShow='';authMode='login';authed=true;render();dailyBackup()},
  'ow-toggle':function(){
    var st=S.settings;
    if(st.ownOn){if(!st.pwHash){st.ownOn=false;save();render();return}modal={type:'pw',mode:'off',who:'owner'};renderModal();return}
    st.ownOn=true;save();render();toast('Senha de Produtos ativada');
  },
  'ow-m':function(){modal={type:'pw',mode:S.settings.ownHash?'change':'set',who:'owner'};renderModal()},
  'ow-setup':function(){
    var a=$('#ow-pw').value,b=$('#ow-pw2').value,e=$('#ow-err');
    if(a.length<4){e.textContent='A senha precisa ter pelo menos 4 caracteres.';return}
    if(a!==b){e.textContent='As senhas não são iguais.';return}
    setPassword(a,'owner').then(function(code){S.settings.ownOn=true;ownerOk=true;save();modal={type:'pw',code:code};render();renderModal()});
  },
  'ow-unlock':function(){checkPw($('#ow-pw').value,'owner').then(function(ok){if(ok){ownerOk=true;render()}else{$('#ow-err').textContent='Senha incorreta.';$('#ow-pw').select()}})},
  'ow-forgot':function(){ownMode='recover';render()},
  'ow-back':function(){ownMode='login';render()},
  'ow-recover':function(){
    var code=normCode($('#ow-code').value),pw=$('#ow-pw').value,e=$('#ow-err');
    if(pw.length<4){e.textContent='A nova senha precisa ter pelo menos 4 caracteres.';return}
    sha(S.settings.pwSalt+code).then(function(h){
      if(h!==S.settings.recHash){e.textContent='Código de recuperação incorreto.';return}
      setPassword(pw,'owner').then(function(nc){ownerOk=true;ownMode='login';save();modal={type:'pw',code:nc};render();renderModal()});
    });
  },
  close:function(){modal=null;renderModal()},
  paper:function(d){S.settings.paper=+d.v;save();render()},
  'prod-new':function(){if(!ownerAllowed())return;modal={type:'prod',id:null};renderModal()},
  'prod-edit':function(d){if(!ownerAllowed())return;modal={type:'prod',id:+d.id};renderModal()},
  'prod-toggle':function(d){if(!ownerAllowed())return;var p=P(d.id);if(!p.on&&!(p.price>0)){toast('Defina o preço antes de ativar este produto.');return}p.on=!p.on;save();render()},
  'prod-del':function(d){if(!ownerAllowed())return;
    var id=+d.id,used=S.bills.some(function(b){return b.items[id]});
    if(used){toast('Produto usado em comandas. Desative em vez de excluir.');return}
    S.products=S.products.filter(function(p){return p.id!==id});save();render();toast('Produto excluído');
  },
  'prod-save':function(){if(!ownerAllowed())return;
    var name=$('#f-name').value.trim(),price=parseMoney($('#f-price').value),cat=$('#f-cat').value,ar=$('#f-art').value;
    var draft={name:name,price:$('#f-price').value,cat:cat,art:ar};
    if(!name){modal.draft=draft;modal.err='Informe o nome do produto.';renderModal();$('#f-name').focus();return}
    if(!(price>0)){modal.draft=draft;modal.err='Informe um preço maior que zero, por exemplo 18,50.';renderModal();$('#f-price').focus();return}
    if(modal.id){var p=P(modal.id);var tbc=!(p.price>0);p.name=name;p.price=price;p.cat=cat;p.art=ar;if(tbc)p.on=true}
    else{S.products.push({id:Math.max.apply(null,S.products.map(function(p){return p.id}).concat([0]))+1,name:name,cat:cat,price:price,art:ar,on:true})}
    modal=null;save();render();renderModal();toast('Produto salvo');
  },
  accent:function(d){S.settings.accent=d.c;applyAccent();save();render()},
  'fee-default':function(){S.settings.fee=!S.settings.fee;save();render()},
  'day-today':function(){selDay='';render()},
  'day-prev':function(){selDay=addDays(curDay(),-1);render()},
  'day-next':function(){selDay=addDays(curDay(),1);render()},
  fs:function(){
    var d=document,deny=function(){toast('Tela cheia indisponível aqui. Use F11 no navegador.',3500)};
    try{
      if(d.fullscreenElement){d.exitFullscreen()}
      else{var p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(deny);else if(!p)deny()}
    }catch(e){deny()}
  },
  'bk-export':function(){if(exportBackup(false)){render();toast('Backup exportado')}},
  'keep-toggle':function(){S.settings.keepOn=!S.settings.keepOn;save();render()},
  'bk-import':function(){var f=$('#bk-file');if(f)f.click()},
  demo:function(){var add=demoBills();S.bills=S.bills.concat(add);S.nextId+=add.length;save();render();toast(add.length+' comandas de exemplo adicionadas')},
  clear:function(){
    if(!confirmClear){confirmClear=true;render();return}
    S.bills=[];S.shifts=[];S.nextId=1;cur=0;confirmClear=false;modal=null;save();render();renderModal();toast('Comandas e turnos apagados');
  }
};

document.addEventListener('click',function(e){
  if(!S)return;
  var sc=e.target;
  if(sc.id==='modal'){A.close();return}
  var el=sc.closest('[data-a]');if(!el)return;
  if(!authed&&!/^(login|setup-pw|forgot|back-login|recover|auth-done|lost|lost-import|lost-wipe)$/.test(el.dataset.a))return;
  var fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset)}
});
document.addEventListener('keydown',function(e){
  if(!S)return;
  if(e.key==='Escape'&&modal){A.close();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-a]')){e.preventDefault();A[e.target.dataset.a](e.target.dataset);return}
  if(e.key==='Enter'){
    var id=e.target.id;
    if(id==='lg-pw'||id==='lg-pw2'||id==='lg-code'){e.preventDefault();A[authMode==='setup'?'setup-pw':authMode==='recover'?'recover':'login']();return}
    if(id==='ow-pw'||id==='ow-pw2'||id==='ow-code'){e.preventDefault();A[!S.settings.pwHash?'ow-setup':ownMode==='recover'?'ow-recover':'ow-unlock']();return}
    if(id==='pw-cur'||id==='pw-new'||id==='pw-new2'){e.preventDefault();A['pw-ok']();return}
    if(id==='q'){e.preventDefault();A.qenter();return}
    if(id==='p-val'){e.preventDefault();A['pay-add']();return}
    if(id==='d-val'){e.preventDefault();A['disc-save']();return}
    if(id==='o-val'){e.preventDefault();A['obs-save']();return}
    if(id==='c-val'||id==='c-note'){e.preventDefault();A['cash-ok']();return}
    if(id==='s-fund'){e.preventDefault();A['shift-open']();return}
    if(id==='sc-val'){e.preventDefault();A['shift-close']();return}
  }
  if(!authed||modal)return;
  if(e.key==='F2'){e.preventDefault();if(view!=='caixa'){view='caixa';render()}var q=$('#q');if(q){q.focus();q.select()}}
  else if(e.key==='F4'){e.preventDefault();A['new-bill']()}
  else if((e.key==='F8'||e.key==='F5')&&view==='caixa'&&cur){e.preventDefault();A['pay-open']({b:cur})}
  else if(e.key==='F9'&&view==='caixa'&&cur&&S.settings.useKitchen){e.preventDefault();var b=bill(cur);if(b&&qtyOf(b)||b&&b.sent)A.kitchen({b:cur})}
});
document.addEventListener('input',function(e){
  if(!S)return;
  var id=e.target.id;
  if(id==='set-name'){
    S.settings.name=e.target.value.trim()||'Lanchonete Sociedade';save();
    document.querySelectorAll('.brand-name,.brand-name2').forEach(function(n){n.textContent=S.settings.name});
  }
  if(id==='set-accent'){S.settings.accent=e.target.value;applyAccent();save()}
  if(id==='q'){pq=e.target.value;render()}
  if(id==='b-name'){var b=bill(cur);if(b&&b.open){b.name=e.target.value.trim();save();var ch=document.querySelector('.chipb.on');if(ch)ch.firstChild.nodeValue=b.name||b.label}}
  if(id==='sc-val'){
    var v=parseMoney(e.target.value),exp=+e.target.dataset.exp,el=$('#sc-diff');
    if(el){
      if(!(v>=0)){el.className='rest';el.lastChild.textContent='—'}
      else{var df=r2(v-exp);el.className='rest '+(df===0?'ok':'bad');el.firstChild.textContent=df===0?'Confere':df>0?'Sobra':'Falta';el.lastChild.textContent=brl(Math.abs(df))}
    }
  }
});
document.addEventListener('change',function(e){
  if(!S)return;
  var id=e.target.id;
  if(id==='set-keep'){var kd=Math.max(7,Math.min(365,parseInt(e.target.value,10)||60));S.settings.keepDays=kd;e.target.value=kd;save();render()}
  if(id==='sel-day'){var v=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){selDay=v===dayKey()?'':v;render()}}
  if(id==='bk-file'){
    var f=e.target.files&&e.target.files[0];
    if(f){var r=new FileReader();r.onload=function(){try{importData(JSON.parse(r.result))}catch(err){lostImport=false;toast('Arquivo de backup inválido.',4000)}};r.readAsText(f)}else lostImport=false;
    e.target.value='';
  }
  if(id==='set-tables'){var n=Math.max(1,Math.min(40,parseInt(e.target.value,10)||10));S.settings.tables=n;e.target.value=n;save()}
  if(id==='set-accent'){render()}
  if(id==='b-label'){var b=bill(cur);if(b&&b.open){b.label=e.target.value;commit()}}
});

/* ================= relógio ================= */
/* ================= relógio ================= */
function tick(){
  var d=new Date();
  var a=$('#c-date'),b=$('#c-time'),c=$('#st-time');
  if(a)a.textContent=d.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  if(b)b.textContent=hhmm(d);
  if(c)c.textContent=hhmm(d);
}
setInterval(tick,20000);
setInterval(function(){if(!S)return;var g=purgeOld();if(g&&authed){render();renderModal();toast(purgeMsg(g),6000)}dailyBackup()},3600000);

window.addEventListener('online',function(){if(S&&authed)render()});
window.addEventListener('offline',function(){if(S&&authed)render()});
if('serviceWorker' in navigator&&!sandboxed&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
boot();
})();
</script>
</body>
